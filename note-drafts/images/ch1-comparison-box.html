<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #FBF3F0;
    width: 1200px;
  }

  .wrap {
    padding: 56px 64px;
  }

  .label {
    display: inline-block;
    background: #E8817A;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 28px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 36px 40px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(180, 110, 100, 0.12);
    border: 2px solid #F3D9D3;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .card:last-child { margin-bottom: 0; }

  .num {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F6E2DE;
    color: #C9564C;
    font-size: 28px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .content { flex: 1; }

  .title {
    font-size: 36px;
    font-weight: 900;
    color: #1A0C0A;
    margin-bottom: 14px;
  }

  .desc {
    font-size: 34px;
    line-height: 1.8;
    color: #1A0C0A;
    font-weight: 700;
  }

  .desc b {
    color: #8F1E14;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="label">判断のものさし</span>

    <div class="card">
      <div class="num">1</div>
      <div class="content">
        <div class="title">人による比較</div>
        <div class="desc">気になる相手が、あなた以外の人（同僚・友人・後輩など）に対して、<b>あなたにするのと同じ行動</b>をしているかどうか</div>
      </div>
    </div>

    <div class="card">
      <div class="num">2</div>
      <div class="content">
        <div class="title">場面による比較</div>
        <div class="desc">同じ相手でも、みんなと一緒にいる時と、あなたと二人きりの時とで、<b>態度や表情がどう変わるか</b></div>
      </div>
    </div>
  </div>
</body>
</html>
