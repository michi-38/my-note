<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #FBF3F0;
    width: 1200px;
  }

  .wrap {
    padding: 56px 64px;
  }

  .label {
    display: inline-block;
    background: #E8817A;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 28px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 36px 40px;
    margin-bottom: 24px;
    box-shadow: 0 4px 14px rgba(180, 110, 100, 0.12);
    border: 2px solid #F3D9D3;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .card:last-child { margin-bottom: 0; }

  .num {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F6E2DE;
    color: #C9564C;
    font-size: 28px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .content { flex: 1; }

  .title {
    font-size: 32px;
    font-weight: 900;
    color: #1A0C0A;
    margin-bottom: 10px;
  }

  .desc {
    font-size: 28px;
    line-height: 1.6;
    color: #1A0C0A;
    font-weight: 700;
  }

  .desc b {
    color: #8F1E14;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="label">このnoteの流れ</span>

    <div class="card">
      <div class="num">1</div>
      <div class="content">
        <div class="title">第1章</div>
        <div class="desc">思い込みを外して、<b>"見る目"</b>を作る</div>
      </div>
    </div>

    <div class="card">
      <div class="num">2</div>
      <div class="content">
        <div class="title">第2〜4章</div>
        <div class="desc"><b>会話・LINE・態度</b>に出るサインを見る</div>
      </div>
    </div>

    <div class="card">
      <div class="num">3</div>
      <div class="content">
        <div class="title">第5章</div>
        <div class="desc">サインを見つけた後、<b>どう動くか</b></div>
      </div>
    </div>
  </div>
</body>
</html>
