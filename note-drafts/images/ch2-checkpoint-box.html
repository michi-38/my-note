<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #FBF3F0;
    width: 1200px;
  }

  .wrap {
    padding: 56px 64px;
  }

  .label {
    display: inline-block;
    background: #E8817A;
    color: #ffffff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 8px 20px;
    border-radius: 999px;
    margin-bottom: 28px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 44px;
    box-shadow: 0 4px 14px rgba(180, 110, 100, 0.12);
    border: 2px solid #F3D9D3;
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .icon {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #F6E2DE;
    color: #A6291D;
    font-size: 30px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .desc {
    font-size: 34px;
    line-height: 1.8;
    color: #1A0C0A;
    font-weight: 700;
  }

  .desc b {
    color: #8F1E14;
    font-weight: 900;
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="label">チェックポイント</span>

    <div class="card">
      <div class="icon">✓</div>
      <div class="desc">質問の<b>数</b>ではなく、一つの答えに対して<b>もう一歩踏み込んでくるかどうか</b>を見てみてください。</div>
    </div>
  </div>
</body>
</html>
